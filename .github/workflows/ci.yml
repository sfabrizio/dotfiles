name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: bash test.sh

  install:
    # run the installer FOR REAL on a throwaway VM of each OS; a non-zero
    # exit (failed step summary) turns the job red
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Run installer for real (${{ matrix.os }})
        run: |
          bash install.sh 2>&1 | tee installer.log
          exit "${PIPESTATUS[0]}"

      - name: Smoke test installed dotfiles (${{ matrix.os }})
        run: |
          bash scripts/smoke-test.sh 2>&1 | tee smoke.log
          exit "${PIPESTATUS[0]}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            installer.log
            smoke.log
          if-no-files-found: ignore

      - name: Report failure digest as commit comment (api-readable)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "==== job: ${{ matrix.os }} / run ${GITHUB_RUN_ID} / sha ${GITHUB_SHA} ===="
            echo "==== installer.log tail ===="
            tail -40 installer.log 2>/dev/null
            echo "==== smoke.log full ===="
            cat smoke.log 2>/dev/null
          } > digest.txt
          # 1) step summary (visible in the run page) 2) commit comment via api
          cp digest.txt "${GITHUB_STEP_SUMMARY:-/dev/null}"
          python3 - <<'EOF' || echo "python digest failed"
          import json, os, urllib.request
          body = open('digest.txt').read()[:60000]
          data = json.dumps({'body': 'CI failure digest:\n```\n' + body + '\n```'}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/commits/%s/comments" % (os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']),
              data=data, method='POST',
              headers={'Authorization': 'token %s' % os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'User-Agent': 'dotfiles-ci'})
          urllib.request.urlopen(req)
          EOF

      - name: Publish failure logs to ci-logs/<os> branch
        if: failure()
        run: |
          mkdir -p logs
          for f in installer.log smoke.log; do
            [ -f "$f" ] && cp "$f" logs/
          done
          if compgen -G "logs/*" >/dev/null; then
            git add logs
            git -c user.email="ci@users.noreply.github.com" -c user.name="ci-logs-bot" \
              commit -m "logs: ${{ matrix.os }} run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}"
            git push -f origin "HEAD:ci-logs/${{ matrix.os }}"
          fi
