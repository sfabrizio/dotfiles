#set -g default-shell /usr/bin/zsh
#set -g default-command /usr/bin/zsh
set -g mouse on
set-option -g status on
set-option -g status-interval 2

# forward clipboard set requests (OSC52) from apps (opencode) to the outer terminal
set -s set-clipboard on
set-option -g status-justify "centre"
set-option -g status-left-length 90
set-option -g status-right-length 90
set-option -g status-left "#(~/.tmux/tmux-powerline/powerline.sh left)"
set-option -g status-right "#(~/.tmux/tmux-powerline/powerline.sh right)"

# status bar background: grey like date segments (colour235), magenta letters (middle window list inherits this)
set-option -g status-style bg=colour235,fg=magenta

# first panel index on 1 not 0 as the default
set-option -g base-index 1

# Default window title colours.
set-window-option -g window-status-style fg=magenta,bg=colour235

# Active window title colours.
set-window-option -g window-status-current-style fg=magenta,bg=colour235,bright

#panel colors settins
set -g pane-border-style bg=colour016
set -g pane-active-border-style bg=colour154
set -g pane-active-border-style fg=colour129


# Prefix = C-t instead of the dedault Ctrl-B
unbind-key 'C-b'
set-option -g prefix 'C-t'
bind-key 'C-t' send-prefix

# clickable status-bar segments (tmux >= 3.3 user status ranges). NB:
# #{mouse_status_range} returns just the range name ('newwin'), not
# 'user|newwin' - 'user|' is only the written syntax in #[range=user|name].
# NB2: clicks on USER ranges always fire plain MouseDown1Status regardless of
# bar side (server-client.c maps STYLE_RANGE_USER -> STATUS); the bare left/
# right areas fire MouseDown1StatusLeft/Right instead. NB3: '\;' does NOT
# sequence inside if-shell branches on tmux 3.5a - so dispatch is one shell
# 'case'. Targets are baked from binding formats at click time (verified:
# in status-click context #{pane_id}/#{window_id} are the active pane/window
# of the session whose bar was clicked).
#   left bar:  '+' opens a new window (byobu F2), stacked-rows opens a
#              horizontal split (byobu Shift-F2)
#   right bar: red cross arms pane-close for 10s (background auto-cancel
#              timer), then shows confirm/cancel icons; confirm (guarded by
#              the armed flag, so stale clicks after cancel do nothing)
#              kills the pane that was active when confirmed; hooks disarm
#              it when a pane actually dies or when focus moves to another
#              pane/window (so switching panels cancels the pending close)
bind-key -T root MouseDown1Status run-shell -b "case '#{mouse_status_range}' in newwin) tmux new-window -t '#{session_id}' ;; newsplit) tmux split-window -v -t '#{pane_id}' ;; closepane) tmux set -g @close_pane_confirm 1; sleep 10; tmux set -g @close_pane_confirm 0 ;; closeconfirm) [ \"#{==:#{@close_pane_confirm},1}\" = 1 ] && { tmux set -g @close_pane_confirm 0; tmux kill-pane -t '#{pane_id}'; } ;; closecancel) tmux set -g @close_pane_confirm 0 ;; *) tmux select-window -t '#{window_id}' ;; esac"
# bare right-status area (date/time/etc) and the dead gaps fire
# MouseDown1StatusDefault; the narrow edge sliver fires ...StatusRight
bind-key -T root MouseDown1StatusDefault next-window
bind-key -T root MouseDown1StatusRight next-window
# disarm the close-confirm when context changes: pane actually dies, or the
# user switches pane/window (mouse click into a pane and keyboard nav both run
# select-pane/select-window, so the hooks cover every way of moving focus)
set-hook -g after-kill-pane "set -g @close_pane_confirm 0"
set-hook -g after-select-pane "set -g @close_pane_confirm 0"
set-hook -g after-select-window "set -g @close_pane_confirm 0"

# easy tmux,conf reload
bind-key r source-file ~/.tmux.conf\; display-message "tmux.conf is reloaded"
