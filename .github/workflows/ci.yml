name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: bash test.sh

  install:
    # run the installer FOR REAL on a throwaway VM of each OS; a non-zero
    # exit (failed step summary) turns the job red
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Run installer for real (${{ matrix.os }})
        run: |
          bash install.sh 2>&1 | tee installer.log
          exit "${PIPESTATUS[0]}"

      - name: Smoke test installed dotfiles (${{ matrix.os }})
        run: |
          bash scripts/smoke-test.sh 2>&1 | tee smoke.log
          exit "${PIPESTATUS[0]}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            installer.log
            smoke.log
          if-no-files-found: ignore

      - name: Publish failure logs to ci-logs branch
        if: failure()
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-logs-bot"
          git fetch --depth=1 origin ci-logs 2>/dev/null || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout -B ci-logs FETCH_HEAD
          else
            git checkout --orphan ci-logs
            git rm -rf --quiet . 2>/dev/null || true
          fi
          mkdir -p "logs/${GITHUB_RUN_ID}-${{ matrix.os }}"
          for f in installer.log smoke.log; do
            [ -f "$f" ] && cp "$f" "logs/${GITHUB_RUN_ID}-${{ matrix.os }}/"
          done
          git add -A
          git commit -m "logs: ${{ matrix.os }} run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}" || echo "nothing to commit"
          git push origin ci-logs
