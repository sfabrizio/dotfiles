name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: bash test.sh

  install:
    # run the installer FOR REAL on a throwaway VM of each OS; a non-zero
    # exit (failed step summary) turns the job red
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Run installer for real (${{ matrix.os }})
        run: |
          bash install.sh 2>&1 | tee installer.log
          exit "${PIPESTATUS[0]}"

      - name: Smoke test installed dotfiles (${{ matrix.os }})
        run: |
          bash scripts/smoke-test.sh 2>&1 | tee smoke.log
          exit "${PIPESTATUS[0]}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            installer.log
            smoke.log
          if-no-files-found: ignore
