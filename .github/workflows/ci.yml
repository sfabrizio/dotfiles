name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: bash test.sh

  install:
    name: Install ${{ matrix.name }}
    # run the installer FOR REAL on a throwaway VM of each OS; a non-zero
    # exit (failed step summary) turns the job red
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: Linux }
          - { os: macos-latest,   name: macOS }
          - { os: windows-latest, name: Windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Run installer for real (${{ matrix.name }})
        run: |
          bash install.sh 2>&1 | tee installer.log
          exit "${PIPESTATUS[0]}"

      - name: Smoke test installed dotfiles (${{ matrix.name }})
        run: |
          bash scripts/smoke-test.sh 2>&1 | tee smoke.log
          exit "${PIPESTATUS[0]}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            installer.log
            smoke.log
          if-no-files-found: ignore

      - name: Push own failure logs to ci-logs/<name> (self channel)
        if: failure()
        continue-on-error: true
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-logs-bot"
          git checkout --orphan ci-selflog-tmp
          git rm -rf --quiet . 2>/dev/null || true
          mkdir -p logs
          {
            echo "job: ${{ matrix.name }} / run ${GITHUB_RUN_ID} / sha ${GITHUB_SHA}"
            date -u
          } > job-info.txt
          for f in installer.log smoke.log; do
            [ -f "$f" ] && cp "$f" logs/
          done
          git add -A
          git commit -q -m "selflog: ${{ matrix.name }} run ${GITHUB_RUN_ID}"
          git push -f origin "HEAD:ci-logs/${{ matrix.name }}"

  report:
    name: Failure report
    needs: [install]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # diagnostic marker: if ci-logs/report/marker.txt appears, this job runs
      - name: Push marker (proves the job executes)
        if: always()
        continue-on-error: true
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-logs-bot"
          git checkout --orphan ci-marker-tmp
          git rm -rf --quiet . 2>/dev/null || true
          mkdir -p logs
          {
            echo "report job executed: run ${GITHUB_RUN_ID} / sha ${GITHUB_SHA} / $(date -u)"
          } > marker.txt
          git add -A
          git commit -q -m "marker: run ${GITHUB_RUN_ID}"
          git push -f origin "HEAD:ci-logs/report"

      - name: Download install job logs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4

      - name: Publish failure logs to ci-logs/report branch (raw-readable, no api rate limit)
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-logs-bot"
          git checkout --orphan ci-logs-report-tmp
          git rm -rf --quiet . 2>/dev/null || true
          mkdir -p logs
          for f in logs-*/installer.log logs-*/smoke.log; do
            [ -f "$f" ] || continue
            cp "$f" "logs/$(echo "$f" | tr '/' '-')"
          done
          git add -A
          git commit -q -m "logs: run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}"
          git push -f origin "HEAD:ci-logs/report"

      - name: "Post failure digest as commit comment (via ubuntu runner)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "==== run ${GITHUB_RUN_ID} / sha ${GITHUB_SHA} ===="
            for f in logs-*/installer.log logs-*/smoke.log; do
              [ -f "$f" ] || continue
              echo "==== $f ===="
              if [[ "$f" == *installer* ]]; then tail -40 "$f"; else cat "$f"; fi
            done
          } > digest.txt
          cp digest.txt "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          for attempt in 1 2 3; do
            if python3 - <<'EOF'
          import json, os, urllib.request
          body = open('digest.txt').read()[:60000]
          data = json.dumps({'body': 'CI failure digest:\n```\n' + body + '\n```'}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/commits/%s/comments" % (os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']),
              data=data, method='POST',
              headers={'Authorization': 'token %s' % os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'User-Agent': 'dotfiles-ci'})
          urllib.request.urlopen(req)
          EOF
            then echo "digest posted"; break; else echo "attempt $attempt failed"; sleep 15; fi
          done
