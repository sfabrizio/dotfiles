# Byobu hook: byobu sources this LAST (tmuxrc order: color.tmux, datetime.tmux,
# profile.tmux, keybindings.tmux, then .tmux.conf), so these settings win.
# Result: byobu launches with the dotfiles tmux.conf - powerline status bar,
# C-t prefix, clickable '+' segment - while keeping byobu's F-key bindings
# and the F12 second prefix set in ~/.byobu/keybindings.tmux.
source ~/dotfiles/tmux.conf
