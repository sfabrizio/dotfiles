name: Install (reusable)

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      label:
        required: true
        type: string

jobs:
  install:
    # run the installer FOR REAL on a throwaway VM; a non-zero exit
    # (failed step summary) turns the job red
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Run installer for real (${{ inputs.label }})
        run: |
          bash install.sh 2>&1 | tee installer.log
          exit "${PIPESTATUS[0]}"

      - name: Smoke test installed dotfiles (${{ inputs.label }})
        run: |
          bash scripts/smoke-test.sh 2>&1 | tee smoke.log
          exit "${PIPESTATUS[0]}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.os }}
          path: |
            installer.log
            smoke.log
          if-no-files-found: ignore

  report:
    name: Failure report (${{ inputs.label }})
    needs: [install]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download install job logs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4

      - name: Diagnostics (written to the job summary - visible in the UI)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Failure report diagnostics"
            echo "### artifact dirs"
            find . -maxdepth 2 -type d | sed 's/^/- /'
            echo "### token read test (expect 200)"
            curl -sS --max-time 10 -o /dev/null -w '%{http_code}\n' \
              -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY" || echo "curl failed"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Publish failure logs to ci-logs/report branch (raw-readable, no api rate limit)
        if: always()
        continue-on-error: true
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-logs-bot"
          git checkout --orphan ci-logs-report-tmp
          git rm -rf --quiet . 2>/dev/null || true
          mkdir -p logs
          for f in logs-*/installer.log logs-*/smoke.log; do
            [ -f "$f" ] || continue
            cp "$f" "logs/$(echo "$f" | tr '/' '-')"
          done
          git add -A
          git commit -q -m "logs: ${{ inputs.label }} run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}"
          git push -f origin "HEAD:ci-logs/report"

      - name: "Post failure digest as commit comment"
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "==== run ${GITHUB_RUN_ID} / sha ${GITHUB_SHA} ===="
            for f in logs-*/installer.log logs-*/smoke.log; do
              [ -f "$f" ] || continue
              echo "==== $f ===="
              if [[ "$f" == *installer* ]]; then
                grep -B2 -A10 '\[FAIL\]' "$f" || true
                tail -25 "$f"
              else
                cat "$f"
              fi
            done
          } > digest.txt
          jq -Rs '{body: ("CI failure digest:\n```\n" + . + "\n```")}' digest.txt > payload.json
          curl -sS --max-time 30 -o /tmp/post.json -w 'comment POST http code: %{http_code}\n' -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            --data-binary @payload.json
